<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CHEFFY | Registration</title>

    <link rel="stylesheet"
          href="css/registration.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>


<body>

    <div class="register-wrapper">


        <!-- LEFT SIDE -->

        <div class="register-decoration">

            <div class="brand">

                <i class="fa-solid fa-kitchen-set"></i>

                <h1>CHEFFY</h1>

                <p>Your Kitchen Helper</p>

            </div>


            <div class="welcome-text">

                <span>WELCOME TO CHEFFY</span>

                <h2>
                    Cook better.<br>
                    Shop smarter.
                </h2>

                <p>
                    Create your account and discover
                    premium kitchen essentials made
                    for everyday cooking.
                </p>


                <div class="mini-features">

                    <div>
                        <i class="fa-solid fa-shield-heart"></i>
                        Secure account
                    </div>

                    <div>
                        <i class="fa-solid fa-basket-shopping"></i>
                        Easy shopping
                    </div>

                    <div>
                        <i class="fa-solid fa-heart"></i>
                        Kitchen favourites
                    </div>

                </div>

            </div>

        </div>



        <!-- REGISTRATION CARD -->

        <div class="register-card">


            <div class="card-heading">

                <div class="mobile-logo">

                    <i class="fa-solid fa-kitchen-set"></i>

                </div>

                <h2>Create Account</h2>

                <p>
                    Join the CHEFFY family today
                </p>

            </div>



            <!-- REGISTRATION FORM -->

            <form id="registrationForm">


                <!-- FIRST NAME + LAST NAME -->

                <div class="input-row">


                    <div class="input-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input
                                id="firstName"
                                type="text"
                                placeholder="First name"
                                required>

                        </div>

                    </div>



                    <div class="input-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input
                                id="lastName"
                                type="text"
                                placeholder="Last name"
                                required>

                        </div>

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            id="email"
                            type="email"
                            placeholder="you@example.com"
                            required>

                    </div>

                </div>



                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-at"></i>

                        <input
                            id="username"
                            type="text"
                            placeholder="Choose a username"
                            required>

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="input-row">


                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                id="password"
                                type="password"
                                placeholder="Create password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>



                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                id="confirmPassword"
                                type="password"
                                placeholder="Confirm password"
                                required>

                        </div>

                    </div>

                </div>



                <!-- TERMS -->

                <label class="terms">

                    <input
                        id="terms"
                        type="checkbox">

                    <span>
                        I agree to the
                        <a href="#"
                           onclick="return false;">
                            Terms & Conditions
                        </a>
                    </span>

                </label>



                <!-- REGISTER BUTTON -->

                <button
                    class="register-btn"
                    type="submit">

                    Create My Account

                    <i class="fa-solid fa-arrow-right"></i>

                </button>



                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="message">
                </p>

            </form>



            <!-- LOGIN LINK -->

            <div class="login-link">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </div>


        </div>

    </div>


    <script src="js/registration.js"></script>

</body>

</html>
